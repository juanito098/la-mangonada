{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido | La Mangonada</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <div class="form-container">
        <h2>Editar Pedido #{{ pedido.id }}</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="nombre_cliente">Nombre del cliente:</label>
                <input type="text" id="nombre_cliente" name="nombre_cliente" value="{{ pedido.nombre_cliente }}" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" value="{{ pedido.telefono }}" required>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" value="{{ pedido.direccion }}" required>
            </div>

            <div class="form-group">
                <label for="metodo_pago">Método de pago:</label>
                <input type="text" id="metodo_pago" name="metodo_pago" value="{{ pedido.metodo_pago }}" required>
            </div>

            <div class="form-group">
                <label for="productos_detalle">Productos:</label>
                <input type="text" id="productos_detalle" name="productos_detalle" value="{{ pedido.productos_detalle }}" required>
            </div>

            <div class="form-group">
                <label for="total">Total ($):</label>
                <input type="number" step="0.01" id="total" name="total" value="{{ pedido.total }}" required>
            </div>

            <button type="submit" class="btn-guardar">Guardar Cambios</button>
            <a href="{% url 'productos' %}" class="btn-cancelar">Cancelar</a>
        </form>
    </div>
</body>
</html>
