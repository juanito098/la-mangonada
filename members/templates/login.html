{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | La Mangonada</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <div class="seccion-carrito">
        <h2>Iniciar Sesión</h2>

        {% if messages %}
            {% for message in messages %}
                <p style="color: #c62828; text-align: center; margin-bottom: 12px;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="grupo-input">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-comprar">Entrar</button>
        </form>

        <p style="text-align: center; margin-top: 15px; font-size: 14px;">
            ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>
        </p>
        <p style="text-align: center; margin-top: 8px; font-size: 14px;">
            <a href="{% url 'index' %}">Volver al inicio</a>
        </p>
    </div>
</body>
</html>
